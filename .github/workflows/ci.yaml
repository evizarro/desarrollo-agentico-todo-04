name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      GO_ENV: test
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Comprobar formato
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Archivos sin formatear:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Migraciones
        run: |
          go install github.com/gobuffalo/pop/v6/soda@v6.4.1
          soda migrate -e test

      - name: Tests
        run: go test -p 1 ./...

      - name: Build
        run: go build ./...

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t todo .
